version: "2"

linters:
  enable:
    # Bugs and correctness
    - errcheck       # unchecked errors
    - errorlint      # errors.Is/As instead of == and type assertions
    - unparam        # unused function parameters

    # Better tests
    - testifylint    # correct testify usage (assertion order, require vs assert)
    - thelper        # test helpers should call t.Helper()

  settings:
    errcheck:
      check-blank: true
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Printf
        - fmt.Println
        - (net/http.ResponseWriter).Write
formatters:
  enable:
    - gofumpt        # stricter gofmt
